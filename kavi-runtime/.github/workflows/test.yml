name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Prefer pinned dev deps if pyproject.toml ships them; otherwise install
          # the runtime + pytest + the small set we know the suite needs.
          if [ -f pyproject.toml ]; then
            pip install -e .
          fi
          pip install pytest

      - name: Run pytest
        run: pytest -x -q
